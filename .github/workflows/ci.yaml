name: CI

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: just check-version "$GITHUB_REF_NAME"

      - name: Format check, lint and test
        run: just ci

  # Static musl binaries, built natively on each architecture.
  # The linker names come from .cargo/config.toml and are provided by musl-tools.
  build:
    needs: [test]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install just and the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y just musl-tools

      - name: Build release binary
        run: just dist ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: prometheus_wireguard_exporter_${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # Idempotent: re-running the job for an existing release only replaces the assets.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" prometheus_wireguard_exporter_* --clobber
