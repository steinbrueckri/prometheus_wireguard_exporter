[package]
name                     = "prometheus_wireguard_exporter"
version                  = "3.6.6"
authors                  = ["Francesco Cogno <francesco.cogno@outlook.com>"]
description              = "Prometheus WireGuard Exporter"
edition                  = "2018"

readme                   = "README.md"
license                  = "MIT"
repository               = "https://github.com/MindFlavor/prometheus_wireguard_exporter"
documentation            = "https://github.com/MindFlavor/prometheus_wireguard_exporter"
homepage                 = "https://github.com/MindFlavor/prometheus_wireguard_exporter"

keywords                 = ["prometheus", "exporter", "wireguard"]
categories               = ["database"]

[features]
default 		 = []
leaky_log     		 = []

[dependencies]
log                      = "0.4"
env_logger               = "0.11"
clap                     = { version = "4.5", features = ["cargo", "env"] }
serde_json               = "1.0"
thiserror                = "2.0"
anyhow                   = "1.0"
hyper                    = { version = "1", features = ["server", "http1"] }
hyper-util               = { version = "0.1", features = ["tokio"] }
http-body-util           = "0.1"
tokio                    = { version = "1", features = ["macros", "rt", "net", "time"] }
prometheus_exporter_base = "1.4.0"
regex                    = "1"
